server {
    listen 80;
    server_name _;

    root /opt/cos/portal;
    index index.html;

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the COS controller
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (plain HTTP requests pass through unaffected -
        # $connection_upgrade is "close" unless the client sent an Upgrade
        # header; see nginx/websocket-upgrade.conf for the map that defines it)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The VM console WebSocket is long-lived (an open serial session,
        # not a request/response call); keep it open instead of nginx's
        # default ~60s read/send timeout closing it mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache static assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
