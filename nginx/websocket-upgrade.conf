# Shared by all server blocks: maps the client's Upgrade header to the
# Connection header nginx should send upstream. Plain HTTP requests (no
# Upgrade header) get "close"; WebSocket handshakes get "upgrade". This must
# live in the http{} context (map is not valid inside a server{} block),
# which is why it is installed separately from nginx/cos-portal.conf - see
# scripts/cos-install.sh.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
